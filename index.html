 const tx=storm.x+storm.tx,tz=storm.z+storm.tz;funnel.position.set(tx,0,tz);const f=storm.funnel*(storm.phase==='tornado'||storm.phase==='fade'?1:0);funnel.visible=f>0.01;

 const r=(4+p[1]*20)*1.15;dummy.position.set(Math.cos(p[0])*r,(3+p[1]*65)*f,Math.sin(p[0])*r);dummy.rotation.set(p[0]*(w.ki>=3?3:0.4),p[0]*2,p[1]*(w.ki>=3?9:2));const sc=(w.sc||1)*p[2]*f;
 if(p[3])dummy.scale.set(p[3][0]*sc*3,p[3][1]*sc*3,p[3][2]*sc);else dummy.scale.setScalar(sc);dummy.updateMatrix();w.im.setMatrixAt(i,dummy.matrix);}w.im.instanceMatrix.needsUpdate=true;});}
 // darkness
